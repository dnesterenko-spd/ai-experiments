# Claude Code Action Configuration
# This file customizes how Claude reviews PRs and responds to comments

# Review settings
review:
  # Automatically review PRs when opened or updated
  auto_review: true

  # Review level: 'full', 'focused', or 'quick'
  # - full: Comprehensive review of all changes
  # - focused: Focus on important changes, skip minor/generated files
  # - quick: High-level review, main concerns only
  level: focused

  # Maximum number of files to review
  max_files: 50

  # Maximum lines of code to review
  max_lines: 2000

# What to focus on during reviews
focus:
  # Code quality checks
  code_quality: true

  # Security vulnerability scanning
  security: true

  # Performance issues
  performance: true

  # Best practices
  best_practices: true

  # Test coverage
  tests: true

  # Documentation
  documentation: true

# Files and patterns to exclude from review
exclude:
  patterns:
    - "*.lock"
    - "*.min.js"
    - "*.min.css"
    - "package-lock.json"
    - "yarn.lock"
    - "pnpm-lock.yaml"
    - "Cargo.lock"
    - "*.generated.*"
    - "dist/**"
    - "build/**"
    - "node_modules/**"
    - ".next/**"
    - "coverage/**"
    - "__pycache__/**"

  # File types to skip
  file_types:
    - "*.md"
    - "*.txt"
    - "*.log"

# Comment behavior
comments:
  # Respond to @claude mentions
  respond_to_mentions: true

  # Auto-resolve conversations when issues are fixed
  auto_resolve: false

  # Comment style: 'review' or 'inline'
  # - review: Post as PR review comments
  # - inline: Post as individual comments
  style: review

  # Minimum severity to comment on: 'info', 'warning', 'error'
  min_severity: warning

# Custom instructions for Claude
instructions: |
  You are an expert code reviewer. When reviewing PRs:

  1. Focus on code quality, security, and best practices
  2. Be constructive and educational in your feedback
  3. Suggest specific improvements with code examples
  4. Highlight both issues and good patterns
  5. Consider the context and existing codebase patterns

  When responding to mentions:
  - Answer questions clearly and concisely
  - Provide code examples when helpful
  - Reference relevant documentation
  - Suggest alternatives when appropriate

# Mention triggers
mentions:
  # Phrases that trigger Claude responses (case-insensitive)
  triggers:
    - "@claude"
    - "hey claude"
    - "claude,"

  # Commands Claude can respond to
  commands:
    - name: "review"
      description: "Review specific files or the entire PR"
      example: "@claude review src/auth.js"

    - name: "explain"
      description: "Explain code or changes"
      example: "@claude explain this function"

    - name: "suggest"
      description: "Suggest improvements or alternatives"
      example: "@claude suggest a better approach"

    - name: "security"
      description: "Focus on security concerns"
      example: "@claude security review"

    - name: "performance"
      description: "Focus on performance issues"
      example: "@claude performance review"

name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write        # For potential fix commits
  pull-requests: write   # Post review comments
  issues: write          # Comment on issues/PRs
  id-token: write        # For OIDC auth (optional, best practice)
  actions: read          # Allow Claude to see CI results

jobs:
  claude-review:
    # Only run on PRs (automatic review mode)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          # Required: Your Anthropic API key
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          # Custom instructions for Claude
          prompt: |
            You are reviewing code in a pull request. Focus on:
            - Code quality and best practices
            - Potential bugs or security issues
            - Performance concerns
            - Maintainability and readability
            - Test coverage

            Be constructive and helpful. Suggest improvements with code examples.
            For minor issues, use suggestions. For major issues, request changes.

            EXCLUDE these file patterns from review:
            - *.lock (package-lock.json, yarn.lock, pnpm-lock.yaml, Cargo.lock, etc.)
            - *.min.js, *.min.css (minified files)
            - dist/**, build/**, .next/**, coverage/** (generated/build artifacts)
            - node_modules/**, __pycache__/** (dependencies)
            - *.generated.* (generated files)

          # Claude CLI arguments
          claude_args: |
            --model claude-sonnet-4-6
            --max-turns 10

          # Optional: Include "Fix this" links in comments
          include_fix_links: true

          # Optional: Custom branch prefix for fix branches
          branch_prefix: "claude/"

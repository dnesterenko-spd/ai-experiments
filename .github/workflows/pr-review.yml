      # - name: Check formatting
      #   run: npm run format:check

      # For Python:
      # - name: Setup Python
      #   uses: actions/setup-python@v5
      #   with:
      #     python-version: '3.11'
      #     cache: 'pip'
      #
      # - name: Install dependencies
      #   run: |
      #     pip install -r requirements.txt
      #     pip install ruff pytest
      #

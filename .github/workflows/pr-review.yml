name: PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

jobs:
  pr-checks:
    name: PR Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for proper diff analysis

      - name: Check PR title
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          echo "PR Title: $PR_TITLE"

          # Validate PR title format (customize as needed)
          if [[ ! "$PR_TITLE" =~ ^(feat|fix|docs|style|refactor|test|chore|perf)(\(.+\))?:\ .+ ]]; then
            echo "::warning::PR title should follow conventional commit format: type(scope): description"
            echo "::warning::Example: feat(api): add user authentication"
          fi

      - name: Check for large files
        run: |
          echo "Checking for large files..."
          large_files=$(find . -type f -size +5M -not -path "./.git/*" || true)
          if [ -n "$large_files" ]; then
            echo "::warning::Large files detected (>5MB):"
            echo "$large_files"
          fi

      - name: Check for secrets
        run: |
          echo "Checking for potential secrets..."
          # Basic pattern matching for common secrets
          if git diff origin/main...HEAD | grep -iE '(api[_-]?key|password|secret|token|private[_-]?key).*=.*["\x27][a-zA-Z0-9]{20,}["\x27]'; then
            echo "::error::Potential secrets detected in diff. Please review!"
            exit 1
          fi

      # Uncomment and customize based on your tech stack:


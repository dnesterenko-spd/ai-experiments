name: PR Size Checker

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  size-check:
    name: Check PR Size
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Check PR size
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number
            });

            const additions = pr.additions;
            const deletions = pr.deletions;
            const totalChanges = additions + deletions;

            let size = 'XS';
            let emoji = '🟢';
            let message = 'This PR is nice and small!';

            if (totalChanges > 1000) {
              size = 'XL';
              emoji = '🔴';
              message = 'This PR is very large. Consider splitting it into smaller PRs.';
            } else if (totalChanges > 500) {
              size = 'L';
              emoji = '🟠';
              message = 'This PR is quite large. Consider splitting it if possible.';
            } else if (totalChanges > 200) {
              size = 'M';
              emoji = '🟡';
              message = 'This PR is medium-sized.';
            } else if (totalChanges > 50) {
              size = 'S';
              emoji = '🟢';
              message = 'This PR is small and focused.';
            }

            const comment = `${emoji} **PR Size: ${size}**\n\n` +
              `📊 Changes: +${additions} -${deletions} (${totalChanges} total)\n\n` +
              `${message}`;

            // Only comment if the PR is large
            if (totalChanges > 500) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: comment
              });
            }

            core.info(comment);

name: Claude PR Assistant

on:
  issue_comment:
    types: [created, edited]
  pull_request_review_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted, edited]

permissions:
  contents: write        # For potential fix commits
  pull-requests: write   # Post review comments
  issues: write          # Comment on issues/PRs
  id-token: write        # For OIDC auth (optional, best practice)
  actions: read          # Allow Claude to see CI results

jobs:
  claude-assistant:
    # Only run on comments that mention @claude
    if: |
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Claude Response
        uses: anthropics/claude-code-action@v1
        with:
          # Required: Your Anthropic API key
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          # Custom instructions for Claude
          prompt: |
            You are a helpful AI assistant for code reviews and development questions.

            When mentioned in a PR comment:
            - Answer questions about the code changes
            - Explain implementation details
            - Suggest improvements or alternatives
            - Help with debugging issues
            - Review specific files or sections when asked

            Be concise but thorough. Provide code examples when helpful.
            If asked to review specific files, focus only on those files.

          # Claude CLI arguments (allow more turns for interactive conversation)
          claude_args: |
            --model claude-sonnet-4-6
            --max-turns 15

          # Explicit trigger phrase (though @claude is the default)
          trigger_phrase: "@claude"

          # Optional: Include "Fix this" links in comments
          include_fix_links: true

          # Optional: Custom branch prefix for fix branches
          branch_prefix: "claude/"
